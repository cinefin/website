{%- comment -%} Docker install box. Params: image, tag {%- endcomment -%}
<div class="dl-card">
  <div class="dl-head">
    <svg class="ico ico-docker" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.8 10.4h2.3v2.2H4.8zM7.6 10.4h2.3v2.2H7.6zM10.4 10.4h2.3v2.2h-2.3zM13.2 10.4h2.3v2.2h-2.3zM7.6 7.7h2.3v2.2H7.6zM10.4 7.7h2.3v2.2h-2.3z"/>
      <path d="M23 11.5c-.6-.4-1.9-.5-2.9-.3-.1-.9-.6-1.7-1.4-2.3l-.5-.3-.3.5c-.4.7-.6 1.6-.4 2.4.1.4.3.8.6 1.1-.4.2-1 .4-1.9.4H1.3c-.1.9 0 1.8.3 2.7l.2.4c1.6 2.9 4.5 4.2 8.3 4.2 5.6 0 10.2-2.5 12.3-7 .9 0 2.1-.3 2.6-1.6l.1-.4-.4-.3z"/>
    </svg>
    <h3>Docker</h3>
    <span class="count">:{{ include.tag }}</span>
  </div>
  <div class="assets">
    <div class="dl-cmd">
      <code>docker pull {{ include.image }}:{{ include.tag }}</code>
      <button class="copy" type="button" aria-label="Copy command" data-copy="docker pull {{ include.image }}:{{ include.tag }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
      </button>
    </div>
    <p class="dl-docker-note">Alternative <a href="https://docs.cinefin.dev/getting-started/installation/">pipx installation guide</a> also in the docs</p>
  </div>
</div>
