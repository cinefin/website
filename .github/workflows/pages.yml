name: Build & deploy site

on:
  push:
    branches: [main]
  # Rebuild periodically so newly published releases show up without a push.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gemfile.lock is intentionally not committed (it's platform-specific and
      # gitignored). Drop any stale copy so Bundler resolves fresh on Ubuntu
      # instead of installing in frozen mode against an out-of-date lockfile.
      - name: Remove any stale lockfile
        run: rm -f Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch release data
        env:
          # Authenticated requests lift the API rate limit; token can read
          # public releases of the other Cinefin repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch-releases.py

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
